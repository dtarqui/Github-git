name: CI/CD

on:
  push:
    branches: [ main ]

permissions:
  contents: read

jobs:
  docker-push:
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Resolve Docker image repository
        env:
          DOCKERHUB_REPOSITORY: ${{ vars.DOCKERHUB_REPOSITORY }}
        run: |
          IMAGE_REPO="$DOCKERHUB_REPOSITORY"

          if [ -z "$IMAGE_REPO" ] && [ -f .env ]; then
            IMAGE_REPO=$(grep -E '^DOCKERHUB_REPOSITORY=' .env | tail -n 1 | cut -d '=' -f2- || true)
          fi

          if [ -z "$IMAGE_REPO" ] && [ -f .env.properties ]; then
            IMAGE_REPO=$(grep -E '^DOCKERHUB_REPOSITORY=' .env.properties | tail -n 1 | cut -d '=' -f2- || true)
          fi

          if [ -z "$IMAGE_REPO" ]; then
            IMAGE_REPO="git-ssh-http-server"
          fi

          echo "IMAGE_REPO=$IMAGE_REPO" >> "$GITHUB_ENV"

      - name: Build and push Docker image
        uses: docker/build-push-action@v7.1.0
        with:
          context: .
          file: ./Dockerfile
          push: true
          labels: |
            org.opencontainers.image.title=Github-git
            org.opencontainers.image.description=Git storage backend (SSH + HTTP) for repositories managed by a microservice layer
            org.opencontainers.image.vendor=Githubx
            org.opencontainers.image.url=https://github.com/dtarqui/Github-git
            org.opencontainers.image.source=https://github.com/dtarqui/Github-git
            org.opencontainers.image.documentation=https://github.com/dtarqui/Github-git/blob/main/README.md
            org.opencontainers.image.licenses=MIT
            org.opencontainers.image.authors=Savitar465
            org.opencontainers.image.version=${{ github.ref_name }}
            org.opencontainers.image.revision=${{ github.sha }}
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.IMAGE_REPO }}:${{ github.sha }}
            ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.IMAGE_REPO }}:latest